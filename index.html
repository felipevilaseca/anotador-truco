<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#eae7e1" />
<meta name="description" content="Anotador simple para partidas de truco" />

<title>Anotador de Truco</title>

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Truco" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="header">
    <div class="name-slot name-slot-a"><span class="team-name" id="nameA">Nosotros</span></div>
    <button id="settingsBtn" class="gear-btn" aria-label="Ajustes">⚙</button>
    <div class="name-slot name-slot-b"><span class="team-name" id="nameB">Ellos</span></div>
  </header>

  <main class="board">
    <button class="column" id="colA" aria-label="Sumar punto a Nosotros">
      <div class="tally" id="tallyA"></div>
    </button>

    <div class="divider" aria-hidden="true"></div>

    <button class="column" id="colB" aria-label="Sumar punto a Ellos">
      <div class="tally" id="tallyB"></div>
    </button>
  </main>

  <footer class="footer">
    <button id="minusA" class="minus-btn" aria-label="Restar punto a Nosotros">−</button>
    <button id="minusB" class="minus-btn" aria-label="Restar punto a Ellos">−</button>
  </footer>

</div>

<div id="winOverlay" class="overlay hidden">
  <div class="overlay-card">
    <div class="win-text"><span id="winnerName">Equipo</span> ganó</div>
    <button id="playAgainBtn" class="primary-btn">Jugar de nuevo</button>
  </div>
</div>

<div id="settingsOverlay" class="overlay hidden">
  <div class="overlay-card">
    <label class="field-label" for="inputA">Nombre equipo 1</label>
    <input id="inputA" class="text-input" maxlength="16" autocomplete="off" />
    <label class="field-label" for="inputB">Nombre equipo 2</label>
    <input id="inputB" class="text-input" maxlength="16" autocomplete="off" />

    <span class="field-label">Puntos para ganar</span>
    <div class="target-select" role="group" aria-label="Puntos para ganar">
      <button class="target-opt" data-target="15">15</button>
      <button class="target-opt" data-target="30">30</button>
    </div>

    <button id="saveNamesBtn" class="primary-btn">Guardar</button>
    <button id="resetBtn" class="link-btn">Reiniciar partida</button>
  </div>
</div>

<div id="resetConfirm" class="overlay hidden">
  <div class="overlay-card">
    <div class="win-text">¿Reiniciar partida?</div>
    <div class="confirm-row">
      <button id="cancelReset" class="secondary-btn">Cancelar</button>
      <button id="confirmReset" class="primary-btn">Reiniciar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
