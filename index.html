<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2a1a0d" />
<meta name="description" content="Anotador simple para partidas de truco" />

<title>Anotador de Truco</title>

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Truco" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="stickGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0" stop-color="#f0e1bd"/>
      <stop offset="0.5" stop-color="#cdb27e"/>
      <stop offset="1" stop-color="#f0e1bd"/>
    </linearGradient>
    <radialGradient id="headGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="0.55" stop-color="#d6491f"/>
      <stop offset="1" stop-color="#7e2410"/>
    </radialGradient>
  </defs>
</svg>

<div class="app">
  <div class="wood-grain" aria-hidden="true"></div>

  <header class="appbar">
    <button id="backBtn" class="bar-btn" aria-label="Deshacer último punto">←</button>
    <h1 class="bar-title">Anotador</h1>
    <button id="menuBtn" class="bar-btn" aria-label="Ajustes">☰</button>
  </header>

  <div class="board">
    <div class="side-rail side-rail-a">
      <button class="round-btn" data-action="plus" data-team="a" aria-label="Sumar punto a Nos">+</button>
      <button class="round-btn" data-action="minus" data-team="a" aria-label="Restar punto a Nos">−</button>
    </div>

    <main class="score-area">
      <div class="col-headers">
        <div class="col-header" id="nameA">Nos:</div>
        <div class="col-header" id="nameB">Ellos:</div>
      </div>
      <div class="columns-wrap">
        <div class="v-divider" aria-hidden="true"></div>
        <div class="columns">
          <button class="column" id="colA" aria-label="Sumar punto a Nos"></button>
          <button class="column" id="colB" aria-label="Sumar punto a Ellos"></button>
        </div>
      </div>
    </main>

    <div class="side-rail side-rail-b">
      <button class="round-btn" data-action="plus" data-team="b" aria-label="Sumar punto a Ellos">+</button>
      <button class="round-btn" data-action="minus" data-team="b" aria-label="Restar punto a Ellos">−</button>
    </div>
  </div>

  <footer class="footer">
    <button id="newMatchBtn" class="pill-btn">Nuevo partido</button>
  </footer>
</div>

<div id="winOverlay" class="overlay hidden">
  <div class="overlay-card">
    <div class="win-text"><span id="winnerName">Equipo</span> ganó</div>
    <button id="playAgainBtn" class="primary-btn">Jugar de nuevo</button>
  </div>
</div>

<div id="settingsOverlay" class="overlay hidden">
  <div class="overlay-card">
    <label class="field-label" for="inputA">Nombre equipo 1</label>
    <input id="inputA" class="text-input" maxlength="16" autocomplete="off" />
    <label class="field-label" for="inputB">Nombre equipo 2</label>
    <input id="inputB" class="text-input" maxlength="16" autocomplete="off" />

    <span class="field-label">Puntos para ganar</span>
    <div class="target-select" role="group" aria-label="Puntos para ganar">
      <button class="target-opt" data-target="15">15</button>
      <button class="target-opt" data-target="30">30</button>
    </div>

    <button id="saveNamesBtn" class="primary-btn">Guardar</button>
  </div>
</div>

<div id="resetConfirm" class="overlay hidden">
  <div class="overlay-card">
    <div class="win-text">¿Nuevo partido?</div>
    <div class="confirm-row">
      <button id="cancelReset" class="secondary-btn">Cancelar</button>
      <button id="confirmReset" class="primary-btn">Empezar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
